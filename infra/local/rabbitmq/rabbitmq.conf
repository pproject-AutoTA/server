# 로컬 compose 전용. 이미지 기본 설정(conf.d/10-defaults.conf) 뒤에 읽힌다.

# 기동할 때 이 디렉터리의 *.json을 모두 읽는다.
#   10-topology.json  큐·exchange·바인딩. 서비스 코드는 선언하지 않는다(contracts/README.md).
#   20-user.json      계정. compose가 .env 값으로 만든다(docker-compose.yml의 configs).
# definitions를 읽으면 RabbitMQ가 기본 계정을 만들지 않으므로 계정도 여기서 넣는다.
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions
