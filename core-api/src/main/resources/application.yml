# 기본 설정만 둔다. 환경별 값은 application-{profile}.yml에서 환경 변수로 주입한다.
spring:
  application:
    name: core-api
  jpa:
    open-in-view: false # API 서버라 요청이 끝날 때까지 DB 연결을 잡고 있지 않는다

cors:
  # 브라우저에서 API를 호출할 프론트 오리진(쉼표로 구분)
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

jwt:
  secret: ${JWT_SECRET}
  expires-in-seconds: ${JWT_EXPIRES_IN_SECONDS:3600}
